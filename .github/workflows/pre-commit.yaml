name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install lint dependencies
        run: uv --cache-dir .uv-cache sync --frozen --group lint
      - name: Run pre-commit checks
        env:
          SKIP: sync-vendor-check
        run: uv --cache-dir .uv-cache run --frozen --group lint pre-commit run --all-files
